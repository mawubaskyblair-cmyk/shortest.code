.box                 →  <div class="box"></div>
#main                →  <div id="main"></div>
p.red                →  <p class="red"></p>
p#big                →  <p id="big"></p>
div.a.b.c            →  <div class="a b c"></div>
p[title="hi"]        →  <p title="hi"></p>
input:text           →  <input type="text">
a[href="#"]          →  <a href="#"></a>
div{Hello}           →  <div>Hello</div>
p{Text $}*3          →  Text 1, Text 2, Text 3
